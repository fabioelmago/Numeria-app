<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Notas</title>
<style>
  :root {
    --bg: #000000;
    --text: #FFFFFF;
    --text-dim: #8E8E93;
    --gold: #FFD60A;
    --divider: #38383A;
    --pill-bg: #2C2C2E;
    --dot-off: transparent;
    --dot-green: #34C759;
    --dot-red: #FF3B30;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    background: var(--bg);
    position: relative;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top, 20px) + 6px) 12px 8px 10px;
    background: var(--bg);
    flex-shrink: 0;
  }

  .back {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--pill-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
  }

  .back svg { width: 10px; height: 16px; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--pill-bg);
    border-radius: 18px;
    padding: 7px 16px;
  }

  .pill svg { width: 19px; height: 19px; color: var(--gold); }

  .done-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .done-btn svg { width: 16px; height: 16px; }

  .editor {
    flex: 1;
    padding: 8px 46px 24px 20px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  textarea#body {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font-size: 32px;
    font-weight: 700;
    line-height: 1.3;
    font-family: inherit;
    padding: 0;
    -webkit-user-select: text;
    user-select: text;
  }

  textarea#body::placeholder { color: #3A3A3C; }

  .keyboard-toolbar {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 8px) + 8px) 16px;
    background: #1C1C1E;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .keyboard-toolbar svg { width: 21px; height: 21px; color: var(--text); flex-shrink: 0; }
  .keyboard-toolbar .aa { font-size: 19px; font-weight: 600; color: var(--text); flex-shrink: 0; }

  #statusDot {
    position: fixed;
    top: calc(env(safe-area-inset-top, 20px) + 46px);
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dot-off);
    transition: background 0.25s ease;
    z-index: 40;
  }

  #holdZone {
    position: fixed;
    top: 110px;
    right: 0;
    width: 64px;
    bottom: 90px;
    z-index: 30;
  }

  #holdZone.active { background: rgba(255,255,255,0.03); }

  #reveal {
    position: fixed;
    left: 14px;
    bottom: calc(env(safe-area-inset-bottom, 8px) + 14px);
    font-size: 12px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 45;
    max-width: 65%;
  }

  #reveal.show { opacity: 1; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="back">
      <svg viewBox="0 0 10 16" fill="none"><path d="M9 1L1 8L9 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="header-right">
      <div class="pill">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 8L3 12L7 16M3 12H15C18 12 20 10 20 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v13M7 8l5-5 5 5M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </div>
      <div class="done-btn" id="doneBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#1C1C1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </header>

  <div class="editor">
    <textarea id="body" placeholder="" inputmode="tel" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus></textarea>
  </div>

  <div class="keyboard-toolbar">
    <span class="aa">Aa</span>
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h2l1 3h11l1-6H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19" r="1.4" fill="currentColor"/><circle cx="17" cy="19" r="1.4" fill="currentColor"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16M4 5v14M20 5v14M4 19h16M9 5v14M14 5v14" stroke="currentColor" stroke-width="1.4"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><path d="M14 10l6-6M9 5l-4.5 4.5a3 3 0 000 4.2l6.8 6.8a3 3 0 004.2 0L20 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 16c2-4 4-6 6-6s3 3 5 3 3-6 7-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

<div id="statusDot"></div>
<div id="holdZone"></div>
<div id="reveal"></div>

<script>
  const SERVER_URL = "https://numeria-server.onrender.com/consultar?token=Numeria";

  const body = document.getElementById('body');
  const statusDot = document.getElementById('statusDot');
  const holdZone = document.getElementById('holdZone');
  const reveal = document.getElementById('reveal');

  let cachedResult = null;
  let numeroBloqueado = null;
  let debounceTimer = null;
  let lastFetchController = null;

  function primerosNueveDigitos(texto) {
    const digitos = texto.replace(/\D/g, '');
    if (digitos.length < 9) return null;
    return digitos.slice(0, 9);
  }

  function marcarEstado(estado) {
    if (estado === 'ok') {
      statusDot.style.background = 'var(--dot-green)';
    } else if (estado === 'notfound') {
      statusDot.style.background = 'var(--dot-red)';
    } else {
      statusDot.style.background = 'var(--dot-off)';
    }
  }

  function programarConsulta() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => precargarResultado(), 150);
  }

  // Despierta el servidor en segundo plano nada mas abrir la app,
  // sin tocar el estado del truco (numeroBloqueado, cachedResult, punto de estado)
  function calentarServidor() {
    const numeroAleatorio = '+34' + String(Math.floor(600000000 + Math.random() * 99999999));
    fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ numero: numeroAleatorio })
    }).catch(() => {});
  }
  calentarServidor();

  const editorZone = document.querySelector('.editor');
  editorZone.addEventListener('touchstart', (e) => {
    // Si el toque no es directamente sobre el texto ya escrito, ocultar teclado
    if (e.target === editorZone) {
      body.blur();
    }
  }, { passive: true });

  const doneBtn = document.getElementById('doneBtn');
  doneBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    body.blur();
  }, { passive: false });
  doneBtn.addEventListener('click', () => {
    body.blur();
  });

  body.addEventListener('input', programarConsulta);

  async function precargarResultado() {
    const texto = body.value || '';
    const digitosActuales = texto.replace(/\D/g, '');

    if (digitosActuales.length < 9) {
      numeroBloqueado = null;
      cachedResult = null;
      marcarEstado(null);
      return;
    }

    if (numeroBloqueado) return;

    const nueve = primerosNueveDigitos(texto);
    if (!nueve) return;

    const numero = '+34' + nueve;
    numeroBloqueado = numero;
    cachedResult = null;
    marcarEstado(null);

    if (lastFetchController) lastFetchController.abort();
    lastFetchController = new AbortController();

    try {
      const res = await fetch(SERVER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero }),
        signal: lastFetchController.signal
      });
      const data = await res.json();
      if (numeroBloqueado !== numero) return;

      const nombre = data.nombre || 'Sin informacion';
      cachedResult = nombre;

      if (nombre === 'Sin informacion' || nombre === 'No se encontro respuesta a tiempo') {
        marcarEstado('notfound');
      } else {
        marcarEstado('ok');
      }
    } catch (e) {
      if (numeroBloqueado === numero) marcarEstado(null);
    }
  }

  function mostrarRevelacion() {
    if (cachedResult) {
      reveal.textContent = cachedResult;
      reveal.classList.add('show');
    }
  }

  function ocultarRevelacion() {
    reveal.classList.remove('show');
  }

  holdZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    holdZone.classList.add('active');
    mostrarRevelacion();
  }, { passive: false });

  holdZone.addEventListener('touchend', () => {
    holdZone.classList.remove('active');
    ocultarRevelacion();
  });

  holdZone.addEventListener('touchcancel', () => {
    holdZone.classList.remove('active');
    ocultarRevelacion();
  });

  holdZone.addEventListener('mousedown', () => {
    holdZone.classList.add('active');
    mostrarRevelacion();
  });
  document.addEventListener('mouseup', () => {
    holdZone.classList.remove('active');
    ocultarRevelacion();
  });
</script>

</body>
</html>
