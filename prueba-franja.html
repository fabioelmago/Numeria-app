<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prueba franja">
<meta name="robots" content="noindex">
<title>Prueba franja</title>
<script>
/* Color inicial: el guardado (para la prueba 6) o blanco. Se aplica antes de pintar. */
var INI=(function(){try{return sessionStorage.getItem('pf')||'#FFFFFF'}catch(e){return '#FFFFFF'}})();
document.documentElement.style.background=INI;
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,system-ui,sans-serif}
body{padding:22px 18px 40px;color:#777}
#strip{position:fixed;top:0;left:0;right:0;height:5px;z-index:2147483647;pointer-events:none}
h1{font-size:20px;margin:6px 0 4px;color:#888}
p{font-size:14px;line-height:1.35;margin:0 0 14px}
button{display:block;width:100%;margin:0 0 10px;padding:15px 14px;border:0;border-radius:16px;
  background:#2F6BFF;color:#fff;font-size:16px;font-weight:600;text-align:left}
button small{display:block;font-weight:400;font-size:12.5px;opacity:.85;margin-top:3px}
button.g{background:#666}
#est{font-size:13px;padding:10px 12px;border-radius:12px;background:rgba(127,127,127,.18);margin-bottom:14px;color:#888}
#menu{position:fixed;inset:0;background:#07070B;z-index:1000;display:none;padding:80px 18px;color:#bbb}
#menu.on{display:block}
</style>
</head>
<body>
<div id="strip"></div>
<h1>Prueba de la franja</h1>
<p>Pulsa cada botón y mira la franja del reloj. Apunta qué números la cambian <b>sin cerrar la app</b>. Cada botón alterna blanco / negro.</p>
<div id="est"></div>

<button onclick="t1()">1 · Fondo de la página<small>Cambia solo el fondo (html y body)</small></button>
<button onclick="t2()">2 · Tira fija de arriba<small>Cambia el color de la tira de 5 px</small></button>
<button onclick="t3()">3 · Tira nueva<small>Borra la tira y crea otra (lo que hace la app)</small></button>
<button onclick="t4()">4 · Etiqueta theme-color<small>Cambia solo la etiqueta de color</small></button>
<button onclick="t5()">5 · Todo a la vez + empujón<small>Fondo, tira, etiqueta y repintado forzado</small></button>
<button onclick="t7()">6 · Menú oscuro encima<small>Abre una capa negra a pantalla completa (toca para cerrarla)</small></button>
<button class="g" onclick="t6()">7 · Recargar con el otro color<small>Control: este debería funcionar siempre</small></button>
<button class="g" onclick="rst()">Reiniciar (todo blanco)</button>

<div id="menu" onclick="this.classList.remove('on');say('Menú cerrado')">Capa de menú oscura.<br><br>¿La franja se ha puesto negra?<br><br>Toca para cerrar.</div>

<script>
var B='#FFFFFF',N='#07070B';
var s={fondo:INI,tira:INI,meta:INI};
function otro(c){return c===B?N:B}
function nom(c){return c===B?'blanco':'negro'}
function say(x){document.getElementById('est').textContent=(x?x+' · ':'')+'fondo '+nom(s.fondo)+' · tira '+nom(s.tira)+' · etiqueta '+nom(s.meta)}
function fondo(c){s.fondo=c;document.documentElement.style.background=c;document.body.style.background=c}
function tira(c){s.tira=c;document.getElementById('strip').style.background=c}
function tiraNueva(c){s.tira=c;var v=document.getElementById('strip');if(v)v.remove();
  var n=document.createElement('div');n.id='strip';n.style.background=c;document.body.insertBefore(n,document.body.firstChild)}
function meta(c){s.meta=c;var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.remove();m=document.createElement('meta');m.name='theme-color';m.content=c;document.head.appendChild(m)}
function t1(){fondo(otro(s.fondo));say('1')}
function t2(){tira(otro(s.tira));say('2')}
function t3(){tiraNueva(otro(s.tira));say('3')}
function t4(){meta(otro(s.meta));say('4')}
function t5(){var c=otro(s.fondo);fondo(c);tiraNueva(c);meta(c);
  document.body.style.display='none';void document.body.offsetHeight;document.body.style.display='';
  window.scrollTo(0,1);requestAnimationFrame(function(){window.scrollTo(0,0)});say('5')}
function t6(){try{sessionStorage.setItem('pf',otro(s.fondo))}catch(e){}location.reload()}
function t7(){document.getElementById('menu').classList.add('on');say('6 menú abierto')}
function rst(){try{sessionStorage.removeItem('pf')}catch(e){}location.reload()}
fondo(INI);tira(INI);say('Inicio');
</script>
</body>
</html>
