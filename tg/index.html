<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Prueba Telegram</title><style>:root { color-scheme: dark; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#0b0b0f; color:#eee; padding:16px; padding-bottom:40px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:#8a8a8f; font-size:13px; margin:0 0 16px; }
  label { display:block; font-size:12px; color:#9a9aa0; margin:10px 0 3px; }
  input { width:100%; box-sizing:border-box; padding:11px 12px; font-size:16px; border-radius:10px; border:1px solid #2a2a30; background:#15151b; color:#fff; }
  button { width:100%; margin-top:12px; padding:13px; font-size:16px; font-weight:600; border:none; border-radius:10px; background:#2d6cff; color:#fff; }
  button.sec { background:#26262c; }
  .bloque { border:1px solid #23232a; border-radius:12px; padding:12px; margin-top:14px; }
  #log { white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace; font-size:12px; background:#101016; border:1px solid #23232a; border-radius:10px; padding:10px; margin-top:16px; min-height:120px; max-height:240px; overflow:auto; color:#b9c7ff; }
  #resultado { white-space:pre-wrap; font-size:15px; background:#0e1a0e; border:1px solid #1f3a1f; border-radius:10px; padding:10px; margin-top:10px; color:#9be89b; }</style></head><body><h1>Prueba · Telegram desde el móvil</h1><p class="sub">Conecta tu Telegram y busca un número, todo desde este dispositivo. Nada pasa por un servidor.</p><div class="bloque"><label>api_id</label> <input id="apiId" inputmode="numeric" placeholder="p. ej. 1234567"> <label>api_hash</label> <input id="apiHash" placeholder="cadena larga de letras y números"> <label>Tu teléfono (con prefijo)</label> <input id="phone" inputmode="tel" placeholder="+34600112233"> <button id="btnConectar">Conectar</button></div><div class="bloque" id="bloqueCodigo" style="display:none"><label>Código que te ha enviado Telegram</label> <input id="codigo" inputmode="numeric" placeholder="12345"> <button id="btnCodigo">Enviar código</button></div><div class="bloque" id="bloquePassword" style="display:none"><label>Contraseña (verificación en dos pasos)</label> <input id="password" type="password" placeholder="tu contraseña de Telegram"> <button id="btnPassword">Enviar contraseña</button></div><div class="bloque" id="bloqueBuscar" style="display:none"><label>Número a buscar (con prefijo)</label> <input id="numero" inputmode="tel" placeholder="+34600112233"> <button id="btnBuscar">Buscar nombre</button><div id="resultado"></div></div><div id="log"></div><button id="btnCerrar" class="sec">Borrar sesión de este dispositivo</button><script>// Captura cualquier error ANTES de que cargue el programa, para verlo en pantalla
    (function(){
      function w(msg){
        var el=document.getElementById('log');
        if(el){ el.textContent += "\n[ERROR] "+msg; }
      }
      window.addEventListener('error', function(e){
        w((e.message||e.error||'error')+ (e.filename?(' @ '+e.filename+':'+e.lineno):''));
      });
      window.addEventListener('unhandledrejection', function(e){
        var r=e.reason; w('promesa: '+((r&&r.message)?r.message:JSON.stringify(r)));
      });
      var el=document.getElementById('log');
      if(el && !el.textContent){ el.textContent='(cargando programa…)'; }
    })();</script><script defer="defer" src="bundle.js"></script></body></html>
