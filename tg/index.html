<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=apple-mobile-web-app-capable content=yes><title>Prueba Telegram</title><style>:root{color-scheme:dark}body{color:#eee;background:#0b0b0f;margin:0;padding:16px 16px 40px;font-family:-apple-system,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif}h1{margin:0 0 4px;font-size:18px}p.sub{color:#8a8a8f;margin:0 0 16px;font-size:13px}label{color:#9a9aa0;margin:10px 0 3px;font-size:12px;display:block}input{box-sizing:border-box;color:#fff;background:#15151b;border-radius:10px;border:1px solid #2a2a30;width:100%;padding:11px 12px;font-size:16px}button{color:#fff;background:#2d6cff;border:none;border-radius:10px;width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600}button.sec{background:#26262c}.bloque{border:1px solid #23232a;border-radius:12px;margin-top:14px;padding:12px}#log{white-space:pre-wrap;color:#b9c7ff;background:#101016;border:1px solid #23232a;border-radius:10px;min-height:120px;max-height:240px;margin-top:16px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;overflow:auto}#resultado{white-space:pre-wrap;color:#9be89b;background:#0e1a0e;border:1px solid #1f3a1f;border-radius:10px;margin-top:10px;padding:10px;font-size:15px}</style></head><body><h1>Prueba · Telegram desde el móvil</h1><p class=sub>Conecta tu Telegram y busca un número, todo desde este dispositivo. Nada pasa por un servidor.<div class=bloque><label>api_id</label> <input id=apiId inputmode=numeric placeholder="p. ej. 1234567"> <label>api_hash</label> <input id=apiHash placeholder="cadena larga de letras y números"> <label>Tu teléfono (con prefijo)</label> <input id=phone inputmode=tel placeholder=+34600112233> <button id=btnConectar>Conectar</button></div><div class=bloque id=bloqueCodigo style=display:none><label>Código que te ha enviado Telegram</label> <input id=codigo inputmode=numeric placeholder=12345> <button id=btnCodigo>Enviar código</button></div><div class=bloque id=bloquePassword style=display:none><label>Contraseña (verificación en dos pasos)</label> <input id=password type=password placeholder="tu contraseña de Telegram"> <button id=btnPassword>Enviar contraseña</button></div><div class=bloque id=bloqueBuscar style=display:none><label>Número a buscar (con prefijo)</label> <input id=numero inputmode=tel placeholder=+34600112233> <button id=btnBuscar>Buscar nombre</button><div id=resultado></div></div><div id=log></div><button id=btnCerrar class=sec>Borrar sesión de este dispositivo</button><script defer src=bundle.js></script></body></html>
